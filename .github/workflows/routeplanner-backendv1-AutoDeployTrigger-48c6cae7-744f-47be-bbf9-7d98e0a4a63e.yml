name: Deploy backend to Azure Container Apps

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/routeplanner-backendv1-AutoDeployTrigger-48c6cae7-744f-47be-bbf9-7d98e0a4a63e.yml"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: routeplannerizrafi.azurecr.io
          username: ${{ secrets.ROUTEPLANNERBACKENDV1_REGISTRY_USERNAME }}
          password: ${{ secrets.ROUTEPLANNERBACKENDV1_REGISTRY_PASSWORD }}
      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: routeplannerizrafi.azurecr.io/routeplanner-backendv1:${{ github.sha }}

      - name: Update Azure Container App
        run: |
          az containerapp update \
            --name routeplanner-backendv1 \
            --resource-group routeplanner \
            --image routeplannerizrafi.azurecr.io/routeplanner-backendv1:${{ github.sha }}


