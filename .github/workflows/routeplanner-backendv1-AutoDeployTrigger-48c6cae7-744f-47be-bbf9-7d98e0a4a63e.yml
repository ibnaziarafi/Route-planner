name: Trigger auto deployment for routeplanner-backendv1

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/routeplanner-backendv1-AutoDeployTrigger-48c6cae7-744f-47be-bbf9-7d98e0a4a63e.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.ROUTEPLANNERBACKENDV1_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.ROUTEPLANNERBACKENDV1_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.ROUTEPLANNERBACKENDV1_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}backend
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: routeplannerizrafi.azurecr.io
          registryUsername: ${{ secrets.ROUTEPLANNERBACKENDV1_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.ROUTEPLANNERBACKENDV1_REGISTRY_PASSWORD }}
          containerAppName: routeplanner-backendv1
          resourceGroup: routeplanner
          imageToBuild: routeplannerizrafi.azurecr.io/routeplanner-backendv1:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


